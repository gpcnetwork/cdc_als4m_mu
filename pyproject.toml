[project]
name = "cdc-als4m"
version = "0.1.0"
description = "als4m project repo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cffi>1.10.1",
    "pyarrow<19.0.0",
    "snowflake-snowpark-python",
    "snowflake-connector-python",
    "pandas",
    "boto3",
    "matplotlib",
    "openpyxl",
    "python-dotenv"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src/Python"}

[tool.setuptools.packages.find]
where = ["src/Python"]